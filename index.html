<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reportlah! demo video</title>
<meta name="description" content="Reportlah! by Sempoi Hackers. Many complaints. One report. QodeFest 2026, Public Good.">
<meta property="og:title" content="Reportlah! demo video">
<meta property="og:description" content="Many complaints. One report. Sempoi Hackers, QodeFest 2026.">
<meta property="og:image" content="poster.jpg">
<meta property="og:type" content="video.other">
<style>
html,body{margin:0;height:100%;background:#07090c;color:#f4f1ea;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
video{width:100%;height:100%;object-fit:contain;background:#07090c}
#sound{position:fixed;left:50%;bottom:11%;transform:translateX(-50%);display:none;align-items:center;gap:10px;min-height:48px;padding:0 22px;border:0;border-radius:24px;background:#ff5a36;color:#0b0f1a;font:600 17px/1 inherit;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#sound:focus-visible{outline:3px solid #fff;outline-offset:3px}
footer{position:fixed;left:16px;right:16px;top:12px;display:flex;justify-content:space-between;gap:12px;font-size:14px;pointer-events:none;text-shadow:0 1px 6px #000}
footer a{color:#ffd9cf;pointer-events:auto}
</style>
</head>
<body>
<main>
<video id="v" src="demo.mp4" poster="poster.jpg" autoplay muted playsinline controls preload="auto"></video>
</main>
<button id="sound" type="button">Tap for sound</button>
<footer><span>Reportlah! · Sempoi Hackers</span><span><a href="deck/">Pitch deck</a> &nbsp;·&nbsp; <a href="https://reportlah.m-naim.workers.dev/">Live app</a></span></footer>
<script>
const v = document.getElementById('v'), b = document.getElementById('sound');
// Try with sound first. Browsers that block it fall back to muted autoplay plus a one-tap unmute.
v.muted = false;
v.play().catch(() => { v.muted = true; b.style.display = 'flex'; return v.play(); }).catch(() => {});
function unmute() { v.muted = false; v.volume = 1; b.style.display = 'none'; if (v.paused) v.play(); }
b.addEventListener('click', unmute);
v.addEventListener('volumechange', () => { if (!v.muted) b.style.display = 'none'; });
</script>
</body>
</html>
